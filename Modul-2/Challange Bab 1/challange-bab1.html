<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Proyek Bab 01: Kalkulator Diskon Belanja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.6;
      color: #333;
    }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 6px;
      background-color: #fafafa;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #004c99;
    }
    .struk-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff;
      border: 1px dashed #666;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-line;
      display: none; /* Ubah menjadi block lewat JS setelah dihitung */
    }
  </style>
</head>
<body>

  <h1>Kalkulator Diskon Belanja Minimarket</h1>
  <p>Lengkapi kode JavaScript di bawah untuk menghitung rincian belanja.</p>

  <div class="card">
    <div class="form-group">
      <label for="input-harga">Harga Barang Asli (Rp):</label>
      <input type="number" id="input-harga" placeholder="Contoh: 100000">
    </div>

    <div class="form-group">
      <label for="input-diskon">Persentase Diskon (%):</label>
      <input type="number" id="input-diskon" placeholder="Contoh: 15">
    </div>

    <button id="btn-hitung">Hitung Pembayaran</button>

    <div class="struk-box" id="hasil-struk"> <p>testing</p> </div>
  </div>
  

  <!-- ============================================================ -->
  <!-- KERJAKAN LOGIKA JAVASCRIPT ANDA DI DALAM TAG SCRIPT BERIKUT  -->
  <!-- ============================================================ -->
  <script>
    // Tulis kode JavaScript Anda di sini.
    // 1. Ambil elemen input-harga, input-diskon, btn-hitung, dan hasil-struk.
    // 2. Pasang event click pada tombol btn-hitung.
    // 3. Konversi nilai input ke tipe number.
    // 4. Lakukan validasi dan perhitungan aritmatika.
    // 5. Tampilkan hasil rincian struk menggunakan Template Literals ke elemen hasil-struk.

    //1
    const inputharga = document.getElementById("input-harga");
    const inputdiskon = document.getElementById("input-diskon");
    const btnhitung = document.getElementById("btn-hitung");
    const hasilstruk = document.getElementById("hasil-struk");

    //2
    btnhitung.addEventListener("click", () => {
      //3
      const hargaawal = parseFloat(inputharga.value);
      const diskon = parseFloat(inputdiskon.value);

      //4
      if(isNaN(hargaawal) || isNaN(diskon)){
        hasilstruk.innerText = 'Harga atau diskon tidak boleh kosong!';
        hasilstruk.style.display = 'block';
        return;
      }

      if (hargaawal < 0 || diskon < 0 || diskon > 100){
        hasilstruk.innerText = 'Masukkan harga atau diskon yang valid!';
        hasilstruk.style.display = 'block';
        return;
      }

      const potongan = hargaawal * (diskon/100);
      const hargadiskon = hargaawal - potongan;

      hasilstruk.innerText = '=====STRUK BELANJA=====\nTotal Belanja: Rp ' + hargaawal + '\nDiskon: ' + diskon + '%\nPotongan Harga: Rp ' + potongan + '\n=======================\nGrand Total: Rp ' + hargadiskon;
    });
  </script>
</body>
</html>
