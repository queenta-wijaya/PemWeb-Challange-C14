<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Proyek Bab 02: Sistem Penilai Akademik</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.6;
      color: #333;
    }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 6px;
      background-color: #fafafa;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 14px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background-color: #004c99;
    }
    .hasil-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff;
      border: 1px dashed #666;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-line;
      display: none; /* Munculkan lewat JS setelah tombol diklik */
    }
    .hasil-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .hasil-nama {
      font-size: 17px;
      font-weight: bold;
      color:#222;
    }
    .badge-grade {

    }
  </style>
</head>
<body>

  <h1>Sistem Penilai Akademik Mahasiswa</h1>
  <p>Lengkapi fungsi-fungsi JavaScript di bawah untuk mengevaluasi nilai.</p>

  <div class="card">
    <div class="form-group">
      <label for="input-nama">Nama Mahasiswa:</label>
      <input type="text" id="input-nama" placeholder="Contoh: Hikari">
    </div>

    <div class="form-group">
      <label for="input-tugas">Nilai Tugas (30%):</label>
      <input type="number" id="input-tugas" placeholder="0 - 100">
    </div>

    <div class="form-group">
      <label for="input-uts">Nilai UTS (35%):</label>
      <input type="number" id="input-uts" placeholder="0 - 100">
    </div>

    <div class="form-group">
      <label for="input-uas">Nilai UAS (35%):</label>
      <input type="number" id="input-uas" placeholder="0 - 100">
    </div>

    <button id="btn-evaluasi">Evaluasi Nilai Mahasiswa</button>

    <div class="hasil-box" id="hasil-evaluasi"></div>
  </div>

  <!-- ============================================================ -->
  <!-- KERJAKAN LOGIKA JAVASCRIPT ANDA DI DALAM TAG SCRIPT BERIKUT  -->
  <!-- ============================================================ -->
  <script>
    const tombol = document.getElementById("btn-evaluasi");

    function hitungNilaiAkhir(tugas, uts, uas) {
      return (tugas * 0.30) + (uts * 0.35) + (uas * 0.35);
    }

    function tentukanGrade(nilaiAkhir) {
      if (nilaiAkhir >= 85) return "A";
      if (nilaiAkhir >= 75) return "B";
      if (nilaiAkhir >= 65) return "C";
      if (nilaiAkhir >= 50) return "D";
      return "E";
    }

    function cekKelulusan(nilaiAkhir) {
      return nilaiAkhir >= 60 ? "LULUS" : "TIDAK LULUS";
    }

    tombol.addEventListener("click", function(){
      const nama = document.getElementById("input-nama").value;
      const tugas = document.getElementById("input-tugas").value;
      const uts = document.getElementById("input-uts").value;
      const uas = document.getElementById("input-uas").value;

      if (nama.trim() === "") {
        alert("NAMA MAHASISWA WAJIB DIISI!");
        return;
      }
      if (tugas === "" || uts === "" || uas === "") {
        alert("SEMUA NILAI WAJIB DIISI!");
        return;
      }

      const angkaTugas = Number(tugas);
      const angkaUTS = Number(uts);
      const angkaUAS = Number(uas);

      if (angkaTugas < 0 || angkaTugas > 100) {
        alert("RANGE TUGAS WAJIB 0-100");
        return;
      }
      if (angkaUTS < 0 || angkaUTS > 100) {
        alert("RANGE UTS WAJIB 0-100");
        return;
      }
      if (angkaUAS < 0 || angkaUAS > 100) {
        alert("RANGE UAS WAJIB 0-100");
        return;
      }

      const nilaiAkhir = hitungNilaiAkhir(angkaTugas, angkaUTS, angkaUAS);
      const grade = tentukanGrade(nilaiAkhir);
      const status = cekKelulusan(nilaiAkhir);

      const komponen = [
        { label: "Tugas", nilai: angkaTugas, bobot: 0.30 },
        { label: "UTS", nilai: angkaUTS, bobot: 0.35 },
        { label: "UAS", nilai: angkaUAS, bobot: 0.35 }
      ];

      let rincian = "";
      for (let i = 0; i < komponen.length; i++) {
        const item = komponen[i];
        const kontribusi = (item.nilai * item.bobot).toFixed(2);
        rincian += `${item.label.padEnd(6)}: ${item.nilai} x ${item.bobot * 100}% = ${kontribusi}\n`;
      }

      const hasilBox = document.getElementById("hasil-evaluasi");
      const teksHasil = `Nama Mahasiswa : ${nama}
--------------------------------
${rincian}--------------------------------
Nilai Akhir    : ${nilaiAkhir.toFixed(2)}
Grade          : ${grade}
Status         : ${status}`;

      hasilBox.textContent = teksHasil;
      hasilBox.style.display = "block";

      console.log(teksHasil);
    });
  </script>
</body>
</html>
